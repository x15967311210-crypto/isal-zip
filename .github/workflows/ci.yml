name: ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW-w64 toolchain)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            make

      - name: Download NASM
        shell: pwsh
        run: |
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip"
          Invoke-WebRequest -UseBasicParsing $url -OutFile nasm.zip
          Expand-Archive nasm.zip -DestinationPath nasm

      - name: Build
        shell: pwsh
        run: |
          $bin = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "ucrt64\bin"
          $env:PATH = "$bin;$env:PATH"
          $nasm = (Resolve-Path ".\nasm\nasm-2.16.03\nasm.exe").Path
          .\build.ps1 -Generator Ninja -Nasm $nasm -Gcc (Join-Path $bin "gcc.exe")

      - name: Smoke test
        shell: pwsh
        run: |
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = "C:\Program Files\7-Zip\7z.exe" }

          New-Item -ItemType Directory -Force smoke\sub | Out-Null
          Set-Content smoke\a.txt "hello isal-zip"
          Set-Content smoke\sub\b.txt "nested file"
          Set-Content "smoke\cafe-测试.txt" "中文内容" -Encoding UTF8
          Set-Content -LiteralPath "smoke\[Content_Types].xml" "<Types/>"

          .\isal_zip.exe 1 smoke.zip --root smoke
          if ($LASTEXITCODE) { throw "isal_zip failed" }

          $env:ISAL_ZIP_THREADS = "4"
          .\isal_zip.exe 1 smoke_mt.zip --root smoke
          Remove-Item Env:\ISAL_ZIP_THREADS
          if ($LASTEXITCODE) { throw "isal_zip (threads) failed" }

          $env:ISAL_ZIP_FORCE64 = "1"
          .\isal_zip.exe 1 smoke64.zip --root smoke
          Remove-Item Env:\ISAL_ZIP_FORCE64
          if ($LASTEXITCODE) { throw "isal_zip (zip64) failed" }

          foreach ($z in "smoke.zip", "smoke_mt.zip", "smoke64.zip") {
            & $sevenZip t $z
            if ($LASTEXITCODE) { throw "7z t $z failed" }
          }

          # isal_zip.dll: exercise the exported isal_zip_pack() via ctypes
          @'
          import ctypes, os, sys, zipfile
          lib = ctypes.CDLL(os.path.abspath("isal_zip.dll"))
          lib.isal_zip_pack.argtypes = [ctypes.c_char_p, ctypes.c_char_p, ctypes.c_int, ctypes.c_int]
          lib.isal_zip_pack.restype = ctypes.c_int
          rc = lib.isal_zip_pack(b"smoke_dll.zip", b"smoke", 1, 4)
          print("isal_zip_pack ->", rc)
          if rc:
              sys.exit(rc)
          names = zipfile.ZipFile("smoke_dll.zip").namelist()
          print("first entry:", names[0])
          sys.exit(0 if names[0] == "[Content_Types].xml" else 3)
          '@ | Set-Content smoke_dll.py
          python smoke_dll.py
          if ($LASTEXITCODE) { throw "isal_zip.dll pack failed" }

          & $sevenZip t smoke_dll.zip
          if ($LASTEXITCODE) { throw "7z t smoke_dll.zip failed" }

          # --- chunk-parallel path: a file big enough to be split into several
          # --- independent Deflate blocks must round-trip byte-for-byte (checks
          # --- FULL_FLUSH concatenation and the combined CRC).
          python -c "open('big.bin','wb').write((b'the quick brown fox jumps over the lazy dog '*40000)*8)"
          $env:ISAL_ZIP_THREADS = "4"
          .\isal_zip.exe 1 big_split.zip big.bin
          Remove-Item Env:\ISAL_ZIP_THREADS
          if ($LASTEXITCODE) { throw "isal_zip (split) failed" }
          & $sevenZip t big_split.zip
          if ($LASTEXITCODE) { throw "7z t big_split.zip failed" }
          Expand-Archive big_split.zip -DestinationPath big_out -Force
          $h1 = (Get-FileHash big.bin -Algorithm SHA256).Hash
          $h2 = (Get-FileHash big_out\big.bin -Algorithm SHA256).Hash
          if ($h1 -ne $h2) { throw "chunk-parallel round-trip mismatch: $h1 vs $h2" }

          # splitting switched off must still produce a valid archive
          $env:ISAL_ZIP_SPLIT = "0"
          .\isal_zip.exe 1 big_nosplit.zip big.bin
          Remove-Item Env:\ISAL_ZIP_SPLIT
          if ($LASTEXITCODE) { throw "isal_zip (split off) failed" }
          & $sevenZip t big_nosplit.zip
          if ($LASTEXITCODE) { throw "7z t big_nosplit.zip failed" }
          Write-Host ("split path: {0:N1} MB -> {1:N1} MB (split) / {2:N1} MB (single stream)" -f `
            ((Get-Item big.bin).Length/1MB), ((Get-Item big_split.zip).Length/1MB), ((Get-Item big_nosplit.zip).Length/1MB))

          # isal_zip.dll: isal_zip_rmtree removes a scratch tree (no cmd.exe/rd)
          @'
          import ctypes, os, sys
          lib = ctypes.CDLL(os.path.abspath("isal_zip.dll"))
          lib.isal_zip_rmtree.argtypes = [ctypes.c_char_p]
          lib.isal_zip_rmtree.restype = ctypes.c_int
          os.makedirs("scratch_tree/sub", exist_ok=True)
          open("scratch_tree/sub/x.txt", "w").write("x")
          rc1 = lib.isal_zip_rmtree(b"scratch_tree")
          rc2 = lib.isal_zip_rmtree(b"scratch_tree")   # idempotent
          print("rmtree rc:", rc1, rc2, "| gone:", not os.path.exists("scratch_tree"))
          sys.exit(0 if rc1 == 0 and rc2 == 0 and not os.path.exists("scratch_tree") else 4)
          '@ | Set-Content smoke_rmtree.py
          python smoke_rmtree.py
          if ($LASTEXITCODE) { throw "isal_zip_rmtree failed" }
          Write-Host "smoke tests passed"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: isal-zip-win64
          path: |
            isal_zip.exe
            isal_zip.dll
            isa-l.dll
          if-no-files-found: error
